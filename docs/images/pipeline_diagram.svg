<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:8; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#1a202c; }
    .title { font-weight:600; font-size:16px; fill:#2b6cb0; }
    .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end: url(#arrowhead); }
    .bg { fill:#f7fafc; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="900" height="320" />

  <!-- Boxes -->
  <rect class="box" x="40" y="38" width="160" height="70" />
  <text class="text" x="120" y="70" text-anchor="middle">Data Update</text>
  <text class="text" x="120" y="88" text-anchor="middle" font-size="12">(Yahoo Finance)</text>

  <rect class="box" x="240" y="18" width="180" height="110" />
  <text class="title" x="330" y="48" text-anchor="middle">Model Manager</text>
  <text class="text" x="330" y="70" text-anchor="middle" font-size="12">registers pretrained</text>
  <text class="text" x="330" y="86" text-anchor="middle" font-size="12">and detects user models</text>

  <rect class="box" x="460" y="38" width="170" height="70" />
  <text class="text" x="545" y="66" text-anchor="middle">Selection Menu</text>
  <text class="text" x="545" y="84" text-anchor="middle" font-size="12">(choose / train)</text>

  <rect class="box" x="660" y="20" width="140" height="48" />
  <text class="text" x="730" y="46" text-anchor="middle">Train NEW</text>

  <rect class="box" x="660" y="110" width="140" height="48" />
  <text class="text" x="730" y="136" text-anchor="middle">Use Model</text>

  <rect class="box" x="360" y="200" width="180" height="70" />
  <text class="text" x="450" y="235" text-anchor="middle">Predict & Output</text>
  <text class="text" x="450" y="253" text-anchor="middle" font-size="12">(9 coins, 3-day forecast)</text>

  <!-- Arrows -->
  <path class="arrow" d="M200 73 L240 73" />
  <path class="arrow" d="M420 73 L460 73" />
  <path class="arrow" d="M630 60 L660 46" />
  <path class="arrow" d="M630 86 L660 134" />
  <path class="arrow" d="M730 68 L730 200" />
  <path class="arrow" d="M450 170 L450 200" />

  <!-- Small labels -->
  <text class="text" x="300" y="14" text-anchor="middle" font-size="12">Auto-register & registry.json</text>

</svg>
